# 기존 Render PostgreSQL을 사용한다. 이 파일은 새 DB를 생성하지 않는다.
services:
  - type: web
    name: q-net-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATABASE_URL
        sync: false
